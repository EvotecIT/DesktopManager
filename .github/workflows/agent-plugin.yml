name: Agent Plugin Package

on:
  pull_request:
    branches: [v2-speedygonzales]
    paths:
      - 'plugins/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'Sources/DesktopManager.Cli/**'
      - 'Sources/DesktopManager/**'
      - 'Sources/Shared/**'
      - 'powerforge.dotnetpublish.json'
      - 'Build/McpBundle/**'
      - 'Directory.Build.props'
      - 'Assets/Icons/DesktopManager.png'
      - '.github/workflows/agent-plugin.yml'
  push:
    branches: [v2-speedygonzales]
    paths:
      - 'plugins/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'Sources/DesktopManager.Cli/**'
      - 'Sources/DesktopManager/**'
      - 'Sources/Shared/**'
      - 'powerforge.dotnetpublish.json'
      - 'Build/McpBundle/**'
      - 'Directory.Build.props'
      - 'Assets/Icons/DesktopManager.png'
      - '.github/workflows/agent-plugin.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktopmanager-windows-verification-v') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate agent release identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $plugin = Get-Content plugins/desktopmanager-windows-verification/plugin.json -Raw | ConvertFrom-Json
          $bundle = Get-Content Build/McpBundle/manifest.json -Raw | ConvertFrom-Json
          if ($bundle.version -ne $plugin.version) { throw 'Plugin and MCPB versions must match.' }
          $project = [xml](Get-Content Sources/DesktopManager.Cli/DesktopManager.Cli.csproj -Raw)
          if ($project.Project.PropertyGroup.Version -ne $plugin.version) { throw 'CLI and plugin versions must match.' }
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -ne "desktopmanager-windows-verification-v$($plugin.version)") { throw 'Release tag must match the plugin version.' }
            git merge-base --is-ancestor HEAD origin/v2-speedygonzales
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check out the shared packer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EvotecIT/PSPublishModule
          ref: 9e7d940d6a107e83d1d2a65a16ead0b2dc3a6979
          path: .powerforge-agent-plugin-build
          persist-credentials: false
      - uses: EvotecIT/PSPublishModule/.github/actions/setup-dotnet@6d2eef9cb69e2d93f89e7f22e9c39fa294260d19
        with:
          global-json-file: .powerforge-agent-plugin-build/global.json
      - name: Build the shared CLI
        working-directory: .powerforge-agent-plugin-build
        run: dotnet build PowerForge.Cli/PowerForge.Cli.csproj -c Release -f net10.0 --nologo
      - name: Validate and package the plugin
        shell: pwsh
        run: |
          $packer = '.powerforge-agent-plugin-build/PowerForge.Cli/bin/Release/net10.0/PowerForge.Cli.dll'
          dotnet $packer agent-plugin validate --source plugins/desktopmanager-windows-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet $packer agent-plugin pack --source plugins/desktopmanager-windows-verification --out "$env:RUNNER_TEMP/desktopmanager-agent-plugin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the portable Windows CLI
        shell: pwsh
        run: |
          $packer = '.powerforge-agent-plugin-build/PowerForge.Cli/bin/Release/net10.0/PowerForge.Cli.dll'
          dotnet $packer dotnet publish --config powerforge.dotnetpublish.json --target DesktopManager.Cli.net10 --rid win-x64 --framework net10.0-windows10.0.19041.0 --style PortableCompat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $request = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-validation","version":"1.0.0"}}}'
          $response = $request | & './Artefacts/PowerForge/Mcp/win-x64/server/desktopmanager.exe' mcp serve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $initialized = $response | ConvertFrom-Json
          $plugin = Get-Content plugins/desktopmanager-windows-verification/plugin.json -Raw | ConvertFrom-Json
          if ($initialized.result.serverInfo.version -ne $plugin.version) { throw 'Packaged MCP server version must match the plugin.' }
          if (-not $initialized.result.safetyPolicy.readOnly) { throw 'Packaged MCP server must start read-only.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktopmanager-agent-plugin
          path: ${{ runner.temp }}/desktopmanager-agent-plugin/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktopmanager-windows-cli
          path: |
            Artefacts/PowerForge/DesktopManager/**/*.zip
            Artefacts/PowerForge/DesktopManager/SHA256SUMS.txt
            Artefacts/PowerForge/DesktopManager/manifest.json
            Artefacts/PowerForge/Mcp/*.mcpb
          if-no-files-found: error
          retention-days: 7

  attach-release:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktopmanager-windows-verification-v') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktopmanager-agent-plugin
          path: agent-plugin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktopmanager-windows-cli
          path: windows-cli
      - name: Attach immutable agent release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp agent-plugin/*.zip agent-plugin/*.sha256 release-assets/
          find windows-cli -type f \( -name '*.zip' -o -name '*.mcpb' \) -print0 | while IFS= read -r -d '' asset; do
            target="release-assets/$(basename "$asset")"
            if [[ -e "$target" ]]; then
              echo "::error::Duplicate release filename: $(basename "$asset")"
              exit 1
            fi
            cp "$asset" "$target"
          done
          (cd release-assets && for checksum in *.sha256; do sha256sum --check "$checksum"; done && sha256sum -- *.zip *.mcpb > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"

  publish-distribution:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktopmanager-windows-verification-v') }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktopmanager-agent-plugin
          path: agent-plugin
      - uses: EvotecIT/PSPublishModule/.github/actions/agent-plugin-publish@9e7d940d6a107e83d1d2a65a16ead0b2dc3a6979
        with:
          archive: agent-plugin
          github-token: ${{ secrets.GITHUB_TOKEN }}
